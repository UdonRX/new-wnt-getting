name: verify-remove-reader-tabs
on:
  push:
    branches:
      - 'work/remove-reader-tabs-news-direct'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remove-reader-tabs-news-direct
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize direct News routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reader = Path('src/features/reader/reader.js')
          s = reader.read_text()
          old = "function applyModeBoundary(nextMode, direction) {\n  setReaderMode(nextMode);\n  if (nextMode === 'papers') return;\n  const states = sourceStates(nextMode);\n  setSelectedFeed(nextMode, direction > 0 ? states[0] : states.at(-1));\n}\n"
          if s.count(old) != 1:
              raise SystemExit('retired applyModeBoundary signature changed')
          reader.write_text(s.replace(old, ''))

          main = Path('src/main.js')
          m = main.read_text()
          old = "export async function navigate(screen,options={}){\n  if(!SCREEN[screen])screen='home';\n  if(options?.source==='home-hero'&&!heroNavigator)await installFinalUiModules();\n"
          new = "export async function navigate(screen,options={}){\n  if(!SCREEN[screen])screen='home';\n  // Normalize plain Read before Hero transition/preload so the retired Reader shell is never a destination.\n  if(screen==='reader'&&!options.readerMode&&!options.readerRecommendations)screen='newsToday';\n  if(options?.source==='home-hero'&&!heroNavigator)await installFinalUiModules();\n"
          if m.count(old) != 1:
              raise SystemExit('navigate entry signature changed')
          main.write_text(m.replace(old, new))
          PY
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/features/reader/reader.js
      - name: Reader regression checks
        run: |
          node scripts/check-reader-flow.mjs
          node scripts/check-summary-flow.mjs
          node scripts/check-summary-single.mjs
      - name: Verify retired Reader is unreachable for plain Read
        shell: bash
        run: |
          ! grep -q "reader-mode-nav" src/features/reader/reader.js
          ! grep -q "{ value: 'news', label: 'ニュース' }" src/features/reader/reader.js
          ! grep -q "applyModeBoundary" src/features/reader/reader.js
          ! grep -q "onPrevFeed:.*switchMode" src/features/reader/reader.js
          ! grep -q "onNextFeed:.*switchMode" src/features/reader/reader.js
          test "$(grep -o "screen==='reader'&&!options.readerMode&&!options.readerRecommendations)screen='newsToday'" src/main.js | wc -l)" -eq 2
          grep -q "readerMode: paper ? 'papers' : 'knowledge'" src/features/home/home.js
          git diff --check
      - name: Commit final verified files to work branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/features/reader/reader.js
          git commit -m 'fix: bypass retired reader before transitions'
          git push origin HEAD:work/remove-reader-tabs-news-direct
