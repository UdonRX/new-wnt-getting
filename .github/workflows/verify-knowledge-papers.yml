name: verify-knowledge-papers
on:
  push:
    branches:
      - 'work/knowledge-papers-reader'
permissions:
  contents: write
jobs:
  verify:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/knowledge-papers-reader
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final targeted home and paper metadata cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path('src/features/home/home.js')
          s = home.read_text()
          replacements = [
            ("""    heroNavigate(navigate, shell, `${kind}:${item.id}`, 'reader', {\n      readerMode: paper ? 'papers' : 'knowledge',\n      openId: String(item.id),\n      ...(paper ? { technologyTab: 'papers' } : {})\n    });""", """    heroNavigate(navigate, shell, `${kind}:${item.id}`, 'reader', {\n      readerMode: paper ? 'papers' : 'knowledge',\n      openId: String(item.id)\n    });"""),
            ("""    const [{ readReaderCache }, { pickHomeKnowledge, pickHomePaper }] = await Promise.all([\n      import('../reader/reader-data.js'),\n      import('../reader/reader-attention.js')\n    ]);\n    const [knowledge, papers] = await Promise.all([readReaderCache('knowledge', 'core'), readReaderCache('papers', 'technology')]);\n    const stored = readJson(DISCOVER_KEY, {}), day = jstDay(), sameDay = stored?.day === day;\n    const knowledgeRead = readSet('pdv2:read:knowledge'), paperRead = readSet('pdv2:read:papers:technology');\n    const knowledgeItems = knowledge?.items || [], paperItems = papers?.items || [];""", """    const [{ readReaderCache }, { dedupePaperItems, pickHomeKnowledge, pickHomePaper }] = await Promise.all([\n      import('../reader/reader-data.js'),\n      import('../reader/reader-attention.js')\n    ]);\n    const [knowledge, papers, creativePapers] = await Promise.all([\n      readReaderCache('knowledge', 'core'),\n      readReaderCache('papers', 'technology'),\n      readReaderCache('papers', 'creative')\n    ]);\n    const stored = readJson(DISCOVER_KEY, {}), day = jstDay(), sameDay = stored?.day === day;\n    const knowledgeRead = readSet('pdv2:read:knowledge'), paperRead = readSet('pdv2:read:papers:technology');\n    const knowledgeItems = knowledge?.items || [];\n    const paperItems = dedupePaperItems([...(papers?.items || []), ...(creativePapers?.items || [])]);"""),
            ("""      knowledge: k, paper: p, knowledgeItems, paperItems,\n      knowledgeFresh: Boolean(knowledge?.fresh), paperFresh: Boolean(papers?.fresh)""", """      knowledge: k, paper: p, knowledgeItems, paperItems,\n      knowledgeFresh: Boolean(knowledge?.fresh), paperFresh: Boolean(papers?.fresh && creativePapers?.fresh)"""),
            ("""      if (force || !result.paperFresh) {\n        sourceJobs.push(loadReader('papers', { force, paperTrack: 'core', fastOnly: true, preferCache: false, backgroundRefresh: true }).catch(() => null));\n      }""", """      if (force || !result.paperFresh) {\n        sourceJobs.push(\n          loadReader('papers', { force, paperTrack: 'core', fastOnly: true, preferCache: false, backgroundRefresh: true }).catch(() => null),\n          loadReader('papers', { force, paperTrack: 'creative', fastOnly: true, preferCache: false, backgroundRefresh: true }).catch(() => null)\n        );\n      }""")
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1: raise SystemExit(f'Expected one home replacement, found {count}: {old[:70]!r}')
              s = s.replace(old, new)
          home.write_text(s)
          tech = Path('lib/technology-research.mjs')
          t = tech.read_text()
          for old, new in [("const VERSION = '生産技術8タブ-v13';", "const VERSION = '生産技術統合-v14';"), ("res.setHeader('X-Technology-Research-Version','13')", "res.setHeader('X-Technology-Research-Version','14')")]:
              count = t.count(old)
              if count != 1: raise SystemExit(f'Expected one technology replacement, found {count}: {old!r}')
              t = t.replace(old, new)
          tech.write_text(t)
          PY
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify changed file syntax
        run: |
          node --check src/features/home/home.js
          node --check src/features/reader/reader.js
          node --check src/features/reader/reader-attention.js
          node --check src/features/reader/reader-focus.js
          node --check lib/technology-research.mjs
          node --check server/papers-feed.mjs
          node --check sw.js
      - name: Verify repository syntax with known main Settings defect isolated
        shell: bash
        run: |
          cp src/features/settings/settings.js /tmp/settings.js.original
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/settings/settings.js'); s=p.read_text()
          old="patchSettings({colors:{[k]:v}}))));"; new="patchSettings({colors:{[k]:v}})))));"
          if s.count(old) != 1: raise SystemExit('Known main Settings syntax signature changed')
          p.write_text(s.replace(old,new))
          PY
          node scripts/check-syntax.mjs
          cp /tmp/settings.js.original src/features/settings/settings.js
      - run: node scripts/check-stable-structure.mjs
      - name: Verify Vercel function count and routes
        shell: bash
        run: |
          test "$(find api -maxdepth 1 -type f -name '*.mjs' | wc -l)" -eq 4
          node - <<'NODE'
          const fs=require('fs'); const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const keys=Object.keys(v.functions||{}).sort();
          const expected=['api/ai.mjs','api/feeds.mjs','api/research.mjs','api/youtube.mjs'];
          if(JSON.stringify(keys)!==JSON.stringify(expected)) throw new Error(`Function set changed: ${keys.join(',')}`);
          if(!(v.rewrites||[]).some(r=>r.source==='/api/papers-feed'&&String(r.destination).includes('__route=papers-feed'))) throw new Error('papers-feed compatibility rewrite missing');
          NODE
      - run: node scripts/check-summary-flow.mjs
      - run: node scripts/check-summary-single.mjs
      - run: node scripts/check-reader-flow.mjs
      - run: node scripts/check-summary-prefetch.mjs
      - run: node scripts/check-recommendations.mjs
      - run: git diff --check
      - name: Assert scope, compatibility references, and removed paper tab machinery
        shell: bash
        run: |
          ! grep -R "TECHNOLOGY_TABS\|TECHNOLOGY_TAB_KEY\|technologyTab: 'papers'\|pdv2:technologyResearchTab" src/features/home src/features/reader --include='*.js'
          grep -q "papers-feed" server/papers-feed.mjs
          grep -q "papers-feed" api/research.mjs
          grep -q "'/api/papers-feed'" vercel.json
          grep -q "reader-attention.js" sw.js
          if git diff --name-only HEAD | grep -Ev '^(src/features/home/home.js|lib/technology-research.mjs)$'; then exit 1; fi
      - name: Commit verified targeted cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/home/home.js lib/technology-research.mjs
          git commit -m 'chore: finalize unified paper home'
          git push origin HEAD:work/knowledge-papers-reader
