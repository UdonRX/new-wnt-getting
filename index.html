<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#090b0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dashboard V2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Personal Dashboard V2</title>
  <link rel="stylesheet" href="/src/styles/tokens.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/base.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/navigation.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/screens.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/app.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/motion.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/active-overrides.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/fullscreen-cleanup.css?v=2210fix2" />
  <link rel="stylesheet" href="/src/styles/weather-detail.css?v=2210fix2" />
  <style>
    /* Align the weather screen's first content row with the other top-level screens. */
    .weather-screen { margin-top: -8px; }

    /* Reader AI summary: compact hero + centered summary stack + bottom article action. */
    .reader-story-card {
      grid-template-rows: clamp(118px, 17dvh, 148px) minmax(0, 1fr) auto !important;
      align-content: stretch !important;
      gap: clamp(7px, .9dvh, 10px) !important;
      padding-bottom: max(88px, calc(env(safe-area-inset-bottom) + 78px)) !important;
    }
    .reader-story-hero {
      justify-content: flex-start !important;
      padding: 11px 12px 12px !important;
      border-radius: 18px !important;
      background: #11161d !important;
    }
    .reader-story-hero-image,
    .reader-story-hero-mesh,
    .reader-story-hero-bottom,
    .reader-story-category-badge,
    .reader-story-source-mark {
      display: none !important;
    }
    .reader-story-hero-top {
      grid-template-columns: minmax(0, 1fr) 36px !important;
      align-items: start !important;
      gap: 10px !important;
    }
    .reader-story-source {
      display: block !important;
      min-width: 0 !important;
    }
    .reader-story-source-copy { gap: 2px !important; }
    .reader-story-source-name { font-size: 12px !important; line-height: 1.2 !important; }
    .reader-story-time { font-size: 9.5px !important; line-height: 1.2 !important; }
    .reader-story-grid.reader-grid-fab {
      width: 36px !important;
      min-width: 36px !important;
      height: 36px !important;
      border-radius: 12px !important;
    }
    .reader-story-content {
      min-height: 0 !important;
      justify-content: center !important;
      gap: 0 !important;
      padding: 0 2px !important;
      overflow: visible !important;
    }
    .reader-story-title.reader-swipe-title {
      position: absolute !important;
      z-index: 3 !important;
      top: calc(max(12px, calc(env(safe-area-inset-top) + 8px)) + 61px) !important;
      left: max(30px, calc(env(safe-area-inset-left) + 26px)) !important;
      right: max(30px, calc(env(safe-area-inset-right) + 26px)) !important;
      margin: 0 !important;
      font-size: clamp(17px, 4.8vw, 20px) !important;
      line-height: 1.18 !important;
      -webkit-line-clamp: 2 !important;
      line-clamp: 2 !important;
      pointer-events: none;
    }
    .reader-story-summary.reader-ai-summary {
      width: 100% !important;
      gap: clamp(10px, 1.35dvh, 14px) !important;
      align-content: center !important;
      transform: translateY(clamp(14px, 2.6dvh, 26px));
    }
    .reader-story-summary-row {
      min-height: clamp(62px, 8.4dvh, 76px) !important;
      box-sizing: border-box !important;
      display: flex !important;
      align-items: center !important;
      padding: clamp(10px, 1.25dvh, 13px) 13px !important;
      border-radius: 14px !important;
    }
    .reader-story-summary-copy {
      width: 100% !important;
      display: grid !important;
      grid-template-columns: 1fr !important;
      row-gap: 4px !important;
      align-items: start !important;
      font-size: 12px !important;
      line-height: 1.46 !important;
    }
    .reader-story-summary-label {
      padding-top: 0 !important;
      font-size: 9px !important;
      line-height: 1.2 !important;
    }
    .reader-story-summary-text {
      font-size: clamp(11.7px, 3.15vw, 12.4px) !important;
      line-height: 1.46 !important;
      display: -webkit-box !important;
      -webkit-box-orient: vertical !important;
      -webkit-line-clamp: 3 !important;
      line-clamp: 3 !important;
      overflow: hidden !important;
    }
    .reader-story-actions {
      position: relative !important;
      z-index: 8 !important;
      align-self: end !important;
      padding: 0 2px !important;
    }
    .reader-story-open {
      min-height: 46px !important;
    }
    @media (max-height: 700px) {
      .reader-story-card {
        grid-template-rows: 118px minmax(0, 1fr) auto !important;
        padding-bottom: max(84px, calc(env(safe-area-inset-bottom) + 74px)) !important;
      }
      .reader-story-title.reader-swipe-title {
        top: calc(max(12px, calc(env(safe-area-inset-top) + 8px)) + 57px) !important;
        font-size: 17px !important;
      }
      .reader-story-summary.reader-ai-summary {
        gap: 8px !important;
        transform: translateY(10px);
      }
      .reader-story-summary-row {
        min-height: 56px !important;
        padding: 8px 11px !important;
      }
      .reader-story-summary-copy { row-gap: 2px !important; }
      .reader-story-summary-text {
        font-size: 11.3px !important;
        -webkit-line-clamp: 2 !important;
        line-clamp: 2 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <main id="app-main" tabindex="-1"></main>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script>
    (()=>{
      const BUILD='2210fix2';
      const RECOVERY_KEY='pdv2:startup-recovery:2210fix2';
      let capturedError='';
      const remember=value=>{if(!capturedError&&value)capturedError=String(value).slice(0,500);};
      window.addEventListener('error',event=>remember(event?.message||event?.error?.message||'JavaScript error'),true);
      window.addEventListener('unhandledrejection',event=>remember(event?.reason?.message||event?.reason||'Promise rejection'));
      const booted=()=>document.documentElement.dataset.pdv2Booted==='1'||Boolean(document.getElementById('app-main')?.childElementCount);
      const clearOld=async()=>{
        if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.map(r=>r.unregister()));}
        if('caches'in window){const keys=await caches.keys();await Promise.allSettled(keys.filter(k=>k.startsWith('personal-dashboard-')).map(k=>caches.delete(k)));}
      };
      setTimeout(async()=>{
        if(booted()){sessionStorage.removeItem(RECOVERY_KEY);return;}
        if(sessionStorage.getItem(RECOVERY_KEY)!=='1'){
          sessionStorage.setItem(RECOVERY_KEY,'1');try{await clearOld();}catch{}location.replace(`/?v=${BUILD}&recovery=1`);return;
        }
        const main=document.getElementById('app-main');
        if(!main||main.childElementCount)return;
        main.innerHTML=`<section class="screen pd-startup-error"><div class="error-box"><strong>アプリを起動できませんでした</strong><br><small>${capturedError||'最新デプロイの読み込みに失敗しています。'}</small><br><br><button type="button" class="soft-button" data-reload>再読み込み</button></div></section>`;
        main.querySelector('[data-reload]')?.addEventListener('click',()=>location.reload());
      },6500);
    })();
  </script>
  <script src="/src/features/twitch/twitch-sync.js?v=2210fix2"></script>
  <script type="module" src="/src/bootstrap.js?v=2210fix2"></script>
</body>
</html>
